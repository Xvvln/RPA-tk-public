[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rpa-tt"
version = "0.1.0"
description = "Auditable Android TikTok RPA"
requires-python = ">=3.11"
dependencies = [
  "uiautomator2>=3.4,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
rpa-tt = "rpa_tt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
